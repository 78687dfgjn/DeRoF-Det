# Parameters
nc: 80  # overridden dynamically by nc argument (1 for VTUAV / NII-CU, 3 for RGBTDronePerson)
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# Dual-stream backbone template (cloned for RGB and TIR streams across P1-P5)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4
  - [-1, 3, C2f, [128, True]]    # 2  (P2, C=96  @ scale m)
  - [-1, 1, Conv, [256, 3, 2]]   # 3-P3/8
  - [-1, 6, C2f, [256, True]]    # 4  (P3, C=192 @ scale m)
  - [-1, 1, Conv, [512, 3, 2]]   # 5-P4/16
  - [-1, 6, C2f, [512, True]]    # 6  (P4, C=384 @ scale m)
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f, [1024, True]]   # 8
  - [-1, 1, SPPF, [1024, 5]]     # 9  (P5, C=576 @ scale m)

# P2-P5 PAN-FPN neck + Detect head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]    # 11: cat backbone P4
  - [-1, 3, C2f, [512]]          # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]    # 14: cat backbone P3
  - [-1, 3, C2f, [256]]          # 15 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 2], 1, Concat, [1]]    # 17: cat backbone P2
  - [-1, 3, C2f, [128]]          # 18 (P2/4 - refined)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]   # 20: cat head P3
  - [-1, 3, C2f, [256]]          # 21 (P3/8 - refined)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]   # 23: cat head P4
  - [-1, 3, C2f, [512]]          # 24 (P4/16 - refined)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]    # 26: cat head P5
  - [-1, 3, C2f, [1024]]         # 27 (P5/32 - refined)

  - [[18, 21, 24, 27], 1, Detect, [nc]]  # Detect(P2, P3, P4, P5)
